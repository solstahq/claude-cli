openapi: 3.0.3
info:
  title: Manifest
  description: >-
    Release tracking and product management.

    ### Model Hierarchy

    Provided as a starting point to visualize data access and as a possible display model.

      + Product
        + Environment
          + Repository
            + Release
            + Update Path

    ### Deployment/Model Considerations

      * Repositories don't have to exist in every environment
      * Releases don't have to exist in every environment
      * Update Paths don't have to exist in every environment
      * When a model doesn't have a default then it's a required field when using POST
      * If you POST to an existing object and don't provide an optional property the existing value will remain
      * If you POST to a non-existing object and don't provide an optional property the default will be used
      * Because of a hack used to store empty values for indexes in dynamo we trim optional strings
      * For sanity most properties are limited to 120 charcters (exception for locations and searchQuery)
      * Environment locations are limited to 4096 characters
      * Search queries are limited to 5120 characters

    ### Naming Restrictions

      * Avoid '.' or '*' in product, environment, repository and release ids.
      * Whitespace at the beginning or ending of a string is automatically stripped.

    ### API Implementation Notes

      * When using limit it's important to note there are instances where it will return < the limit with a last key
    test
        1. If the size of the return content exceeds 4MB
        2. If the database search is taking a long time
      * For hashing purposes we use dotted notation to store most partition keys.

    #### Partition Keys

    Using dotted notation allows for a much smaller subset of data to be searched when querying.

      * Product = org.product
      * Environment = org.product.env
      * Repository =  org.product.env.repository

    #### Sort Keys

    Using dotted notation for the sort key allows fine grained searching.  However, since dynamo only supports
    begins_with, every property is dependent on the previous properties. For example, when source from an update path
    the target is required.

      * Update Path = target.source

    #### Sort Filters

    For efficient querying, pre-filter the dataset using exact matches on relevant sort fields before applying the
    search query.

      * /product?**product=TestProduct**&sortField=**product**
      * /env?product=TestEv&**env=TestEnv**&sortField=**env**
      * /history?product=TestEv&env=TestEnv&**history=TestHistory**&sortField=**history**

    #### Normalization

    The endpoint should normalize the value from the database before returning to the requestor.

      ```
      {
        "product": "solidstatenetworks-com.testprod"
      }
      ```

    becomes:

      ```
      {​​​​​
        "org": "solidstatenetworks-com",
        "product": "testprod",
      }
      ```

    Conversely, the API should also check for the appropriate properties and construct dotted notation during any object
    creation/manipulation.
  version: "1.10.0"
servers:
  - url: https://{audience}.snxd.com/manifest
    variables:
      audience:
        default: axis
        description: SSN internal use only
tags:
  - name: Environment
    description:
      The purpose of an Environment to create groupings like "QA," "Stage,"
      and "Production." Each environment has Locations and History.
  - name: History
    description:
      A collection of snapshots showing the change of state in an Environment
      over time. Each snapshot consists of Repository and Release key value pairs.
  - name: Invite
    description: A request to join a team.  Invites are sent to a user's email address.
  - name: Machine
    description:
      A Machine is a physical or virtual device that can be used to run without
      a user interface.  It can be used to run a build server
  - name: Membership
    description:
      Assign member roles to product and environments. Add users to teams.
      A member is a team or user.
  - name: Organization
    description: A collection of users, teams and products
  - name: Product
    description:
      A Product is a collection of Environments a publisher can select to
      create an end-user experience.
  - name: Publish
    description:
      Published content is a collection of files made available to end-users.  It can consist of either a single file
      or a zip of the environment.
  - name: Release
    description:
      A collection of one or more files. It can consist of either the files
      themselves, or Piece files that can be reassembled into the original files.
  - name: Repository
    description:
      A collection of Releases. It can be thought of as different versions
      of the collection of files that make up a Release.
  - name: Team
    description: A group of users.
  - name: Update Path
    description:
      A set of Update Pieces and/or a Mask, plus an expanded Catalog that
      contains the Mask and the URL for the Update Pieces as well as "standard" pieces.
      It is not required to perform an Update, but its presence can significantly reduce
      the amount of data and time required to perform an Update.
  - name: User
    description:
      A user is a person who has access to an organization.  A user can be a member of
      one or more organizations.
paths:
  /env:
    get:
      tags:
        - Environment
      summary: Retrieve environments. Use optional env parameter to filter dataset.
      description: |
        [D4T-28](https://solidstatenetworks.jira.com/browse/D4T-28): View environments inside product

        |Object|Permissions|
        |-|-|
        |environment|ReadEnvironment|
      parameters:
        - name: product
          in: query
          description: Product id
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Number of items to return (0 is the same as skipping the param).
          schema:
            type: integer
        - name: searchQuery
          in: query
          description: Additional info available at [Search Query](search_query.md).
          schema:
            type: string
        - name: sortDirection
          in: query
          description: Sort search results (backward, forward)
          schema:
            type: string
            default: forward
        - name: sortField
          in: query
          description: Property used to sort (createdTime, env, modifiedTime, name, tags)
          schema:
            type: string
            default: env
        - name: startKey
          in: query
          description:
            The primary key of the first item that this operation will evaluate.
            Use the value that was returned for lastKey in the previous operation.
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvPaginated"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestError"
