components:
  schemas:
    EnvObject:
      type: object
      properties:
        aliasLocation:
          type: string
          description: Alternative uri used by a client when retrieving an alias.
          default: <empty string>
        catalogLocation:
          type: string
          description: Alternative uri used by a client when retrieving an catalog.
          default: <empty string>
        createdTime:
          type: integer
          description:
            Creation time (UTC). Auto populated during object creation
            if the property is missing. Manual setting of this property only succeeds
            on object creation.
          format: int64
        deletionProtection:
          type: boolean
          description: Protects item from deletion
          default: false
        description:
          type: string
          description: Friendly description.
          default: <empty string>
        env:
          type: string
          description: Environment id
        historyRetention:
          type: object
          description: History retention policy
          $ref: "#/components/schemas/RetentionObject"
        modifiedTime:
          type: integer
          description:
            Modified time (UTC). Auto populated during object modification
            if the property is missing.
          format: int64
        name:
          type: string
          description: Friendly name
          default: <empty string>
        org:
          type: string
          description: Organization id. Auto populated during object creation.
        product:
          type: string
          description: Product id
        metafileLocation:
          type: string
          description: Alternative uri used by a client when retrieving a metafile.
          default: <empty string>
        publishLocation:
          type: string
          description: Alternative uri used by a client when retrieving an asset.
          default: <empty string>
        publishRetention:
          type: object
          description: Publish retention policy
          $ref: "#/components/schemas/RetentionObject"
        releaseRetention:
          type: object
          description: Release retention policy
          $ref: "#/components/schemas/RetentionObject"
        sourceLocation:
          type: string
          description: Uri used by deploy tools when ingesting assets.
          default: <empty string>
        storageType:
          type: string
          description: Storage type for repositories in the environment (pieceshared/piece/file).
          default: <empty string>
        tags:
          type: string
          description: Comma separated list of release tags.
          default: <empty string>
        updatePathCount:
          type: integer
          description: Number of update paths automatically created during promotion.
          format: int64
          default: 0
    EnvPaginated:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            allOf:
              - $ref: "#/components/schemas/EnvObject"
              - type: object
                properties:
                  permissions:
                    $ref: "#/components/schemas/EnvPermissions"
        lastKey:
          type: string
          description:
            If this key is present in the response, paginate the result
            set
    EnvMemberObject:
      type: object
      properties:
        env:
          type: string
          description: Environment id
        memberEmail:
          type: string
          description: Member email (if available)
        memberName:
          type: string
          description: Member name (if available)
        memberPicture:
          type: string
          description: Member picture (if available)
        memberType:
          type: string
          description: Type of member (organization, team, user)
        member:
          type: string
          description: Team or user id
        org:
          type: string
          description: Organization id
        product:
          type: string
          description: Product id
        role:
          type: string
          description: Role Name (admin, viewer)
    EnvMemberGetObject:
      type: object
      properties:
        env:
          type: string
          description: Environment id
        memberEmail:
          type: string
          description: Member email (if available)
        memberName:
          type: string
          description: Member name (if available)
        memberPicture:
          type: string
          description: Member picture (if available)
        memberType:
          type: string
          description: Type of member (organization, team, user)
        member:
          type: string
          description: Team or user id
        org:
          type: string
          description: Organization id
        product:
          type: string
          description: Product id
        roles:
          type: array
